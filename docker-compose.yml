services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: morpho
      POSTGRES_PASSWORD: morpho
      POSTGRES_DB: morpho
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morpho -d morpho"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: ./service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://morpho:morpho@postgres:5432/morpho
      RPC_URL: ${RPC_URL:-https://mainnet.base.org}
      CHAIN_ID: ${CHAIN_ID:-8453}
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "4000:4000"
    restart: unless-stopped

volumes:
  pgdata:
